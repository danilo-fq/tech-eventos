<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"
  >
  <link

  <link rel="stylesheet" href="../css/style.css">

  <title>Sobre e contato · TechEventos</title>

<body>
  <header class="m-2">
    <nav class="navbar navbar-expand-md">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">

        </a>

        </button>

        <div id="mobileMenu" class="offcanvas-md offcanvas-end" style="--bs-offcanvas-width: 322px;">

            <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
              <img src="../images/techeventos-icone.svg" alt="Logomarca Tech Eventos">

            </a>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#mobileMenu" aria-label="Fechar menu"></button>
          </div>

          <div class="offcanvas-body d-flex flex-column">
            <ul class="navbar-nav mx-lg-auto gap-md-3">
              <li class="nav-item border-bottom py-2">
                <a href="../index.html" class="nav-link d-flex justify-content-between align-items-center">
                  Início
                  <i class="bi bi-chevron-right d-md-none text-secondary" aria-hidden="true"></i>
                </a>
              </li>
              <li class="nav-item border-bottom py-2">
                <a href="./eventos.html" class="nav-link d-flex justify-content-between align-items-center">
                  Eventos
                  <i class="bi bi-chevron-right d-md-none text-secondary" aria-hidden="true"></i>
                </a>
              </li>
              <li class="nav-item border-bottom py-2">
                <a href="./sobre-contato.html" class="nav-link d-flex justify-content-between align-items-center active" aria-current="page">
                  Sobre
                  <i class="bi bi-chevron-right d-md-none text-secondary" aria-hidden="true"></i>
                </a>
              </li>
              <li class="nav-item border-bottom py-2">
                <a href="./sobre-contato.html#contato" class="nav-link d-flex justify-content-between align-items-center">
                  Contato
                  <i class="bi bi-chevron-right d-md-none text-secondary" aria-hidden="true"></i>
                </a>
              </li>
            </ul>

            <div class="mt-auto d-md-none">
              <p class="small fw-medium">Organiza um evento de tecnologia?</p>
              <a class="btn btn-primary w-100" href="./sobre-contato.html#contato">
                <i class="bi bi-megaphone me-2" aria-hidden="true"></i>
                Divulgar evento
              </a>
            </div>
          </div>
        </div>

        <a class="btn btn-primary d-none d-lg-inline-flex" href="./sobre-contato.html#contato">

        </a>

    <section id="sobre"></section>
    <section id="contato"></section>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
